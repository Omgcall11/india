# Cloudflare proxy: visitors hit Cloudflare, Cloudflare hits this origin.
# SSL/TLS mode in Cloudflare should be Full (self-signed origin cert is OK).
# For Full (strict), replace origin.crt/key with a Cloudflare Origin Certificate.

ssl_certificate     /etc/ssl/sakura-jp.wiki/origin.crt;
ssl_certificate_key /etc/ssl/sakura-jp.wiki/origin.key;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sakura-jp.wiki www.sakura-jp.wiki;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
